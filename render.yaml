services:
  - type: web
    name: watchroom-live
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
    healthCheckPath: /api/health
    autoDeploy: true
